name: kaizen

services:
  database:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: kaizen_local
      POSTGRES_USER: kaizen_local
      POSTGRES_PASSWORD: ${LOCAL_DATABASE_PASSWORD:?Configure LOCAL_DATABASE_PASSWORD no .env}
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - database_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaizen_local -d kaizen_local"]
      interval: 5s
      timeout: 5s
      retries: 12

  database-test:
    image: postgres:18.6-alpine
    profiles: [test]
    environment:
      POSTGRES_DB: kaizen_test
      POSTGRES_USER: kaizen_test
      POSTGRES_PASSWORD: ${TEST_DATABASE_PASSWORD:?Configure TEST_DATABASE_PASSWORD no .env}
      TZ: UTC
    ports:
      - "127.0.0.1:${TEST_DATABASE_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaizen_test -d kaizen_test"]
      interval: 5s
      timeout: 5s
      retries: 12

  database-backup-source:
    image: postgres:18.6-alpine
    profiles: [backup-test]
    environment:
      POSTGRES_DB: kaizen_backup_source
      POSTGRES_USER: kaizen_backup
      POSTGRES_PASSWORD: ${BACKUP_DATABASE_PASSWORD:?Configure BACKUP_DATABASE_PASSWORD no .env}
      TZ: UTC
    ports:
      - "127.0.0.1:${BACKUP_SOURCE_DATABASE_PORT:-5434}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaizen_backup -d kaizen_backup_source"]
      interval: 5s
      timeout: 5s
      retries: 12

  database-backup-restore:
    image: postgres:18.6-alpine
    profiles: [backup-test]
    environment:
      POSTGRES_DB: kaizen_backup_restore
      POSTGRES_USER: kaizen_backup
      POSTGRES_PASSWORD: ${BACKUP_DATABASE_PASSWORD:?Configure BACKUP_DATABASE_PASSWORD no .env}
      TZ: UTC
    ports:
      - "127.0.0.1:${BACKUP_RESTORE_DATABASE_PORT:-5435}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaizen_backup -d kaizen_backup_restore"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  database_data:
